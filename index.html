<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flip Clock</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: table;
      width: 100%;
      height: 100vh;
    }

    .page {
      display: table-cell;
      text-align: center;
      vertical-align: middle;
      padding: 16px;
    }

    .clock {
      position: relative;
      display: inline-block;
      max-width: 100%;
      padding: 14px;
      background: #000;
      white-space: nowrap;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .clock-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .date {
      margin-top: 10px;
      color: #888;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .period {
      display: inline-block;
      width: 34px;
      margin-left: 8px;
      color: #888;
      font-size: 13px;
      font-weight: normal;
      text-align: left;
      vertical-align: middle;
    }

    .time-format {
      position: fixed;
      right: 20px;
      bottom: 18px;
      display: flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid #292929;
      border-radius: 5px;
      background: #0b0b0b;
      opacity: 0.7;
      transition: opacity 160ms ease;
    }

    .timer-tools {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 1;
      width: 224px;
      padding: 8px;
      border: 1px solid #292929;
      border-radius: 5px;
      background: #0b0b0b;
      opacity: 0.8;
      transition: opacity 160ms ease;
    }

    .timer-tools:hover,
    .timer-tools:focus-within {
      opacity: 1;
    }

    .timer-toggle,
    .timer-panel button {
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 3px;
      background: #171717;
      color: #ddd;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .timer-toggle {
      width: 100%;
    }

    .timer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      overflow: auto;
      padding: 20px;
      background: #000;
      text-align: center;
    }

    .timer-back {
      position: absolute;
      top: 18px;
      right: 20px;
      width: auto;
    }

    .timer-content {
      width: 224px;
      max-width: 100%;
      margin: 15vh auto 0;
      text-align: left;
    }

    .timer-modes,
    .timer-controls {
      display: flex;
      gap: 4px;
    }

    .timer-modes button,
    .timer-controls button {
      flex: 1;
    }

    .timer-panel button[aria-pressed="true"] {
      background: #333;
      color: #fff;
    }

    .timer-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 10px 0;
      color: #aaa;
      font-size: 12px;
    }

    .timer-inputs label {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timer-inputs input {
      width: 48px;
      padding: 5px 3px;
      border: 1px solid #333;
      border-radius: 3px;
      background: #171717;
      color: #fff;
      font: inherit;
      text-align: center;
    }

    .timer-display {
      margin: 24px 0 4px;
      color: #fff;
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .timer-laps {
      max-height: 180px;
      margin: 12px 0 0;
      padding: 0;
      overflow: auto;
      color: #bbb;
      font-size: 13px;
      list-style: none;
    }

    .timer-laps li {
      padding: 6px 2px;
      border-bottom: 1px solid #222;
    }

    .timer-status {
      min-height: 16px;
      margin-bottom: 8px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    .timer-tools button:focus,
    .timer-tools input:focus {
      outline: 1px solid #aaa;
      outline-offset: 1px;
    }

    .time-format:hover,
    .time-format:focus-within {
      opacity: 1;
    }

    .time-format button {
      min-width: 38px;
      padding: 5px 7px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #777;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .time-format button[aria-pressed="true"] {
      background: #252525;
      color: #eee;
    }

    .time-format button:focus-visible {
      outline: 1px solid #aaa;
      outline-offset: 1px;
    }

    .digits {
      display: inline-block;
      vertical-align: middle;
    }

    .digit {
      position: relative;
      display: inline-block;
      width: 82px;
      margin: 0 4px;
      overflow: hidden;
      border-radius: 5px;
      background: #171717;
      color: #fff;
      font-size: 68px;
      font-weight: bold;
      line-height: 1.35;
      text-align: center;
      vertical-align: middle;
      box-shadow: 0 4px 0 #333;
    }

    .digit:after {
      position: absolute;
      top: 50%;
      right: 0;
      left: 0;
      height: 1px;
      background: #000;
      content: "";
    }

    .separator {
      display: inline-block;
      margin: 0 2px;
      color: #fff;
      font-size: 60px;
      font-weight: bold;
      line-height: 1;
      vertical-align: middle;
      -webkit-animation: blink 1s steps(2, start) infinite;
      animation: blink 1s steps(2, start) infinite;
    }

    @-webkit-keyframes blink {
      to { opacity: 0.45; }
    }

    @keyframes blink {
      to { opacity: 0.45; }
    }

    .flip {
      -webkit-animation: flip 0.45s ease-in-out;
      animation: flip 0.45s ease-in-out;
    }

    @-webkit-keyframes flip {
      0% { -webkit-transform: rotateX(0); }
      50% { -webkit-transform: rotateX(-90deg); }
      100% { -webkit-transform: rotateX(0); }
    }

    @keyframes flip {
      0% { transform: rotateX(0); }
      50% { transform: rotateX(-90deg); }
      100% { transform: rotateX(0); }
    }

    @media screen and (max-width: 420px) {
      .clock {
        padding: 8px 2px;
      }

      .digit {
        width: 58px;
        margin: 0 2px;
        font-size: 48px;
      }

      .separator {
        font-size: 44px;
      }

      .date {
        font-size: 13px;
      }

      .time-format {
        right: 12px;
        bottom: 12px;
      }

      .timer-tools {
        top: 12px;
        right: 12px;
      }

      .timer-back {
        top: 12px;
        right: 12px;
      }

      .timer-content {
        margin-top: 18vh;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="clock-stack">
      <div class="clock" id="clock" role="timer" aria-label="Current time">
        <span class="digits">
          <span class="digit" id="hour-tens">0</span><span class="digit" id="hour-ones">0</span>
        </span>
        <span class="separator" aria-hidden="true">:</span>
        <span class="digits">
          <span class="digit" id="minute-tens">0</span><span class="digit" id="minute-ones">0</span>
        </span><span class="period" id="period" aria-hidden="true"></span>
      </div>
      <div class="date" id="date" aria-live="off"></div>
    </div>
  </div>

  <div class="time-format" role="group" aria-label="Time format">
    <button type="button" id="format-12" aria-pressed="true">12h</button>
    <button type="button" id="format-24" aria-pressed="false">24h</button>
  </div>

  <div class="timer-tools">
    <button type="button" class="timer-toggle" id="timer-toggle" aria-expanded="false" aria-controls="timer-panel">Timer</button>
  </div>

  <div class="timer-panel" id="timer-panel" style="display: none;">
    <button type="button" class="timer-back" id="timer-back">Back to clock</button>
    <div class="timer-content">
      <div class="timer-modes" role="group" aria-label="Timer mode">
        <button type="button" id="countdown-mode" aria-pressed="true">Countdown</button>
        <button type="button" id="stopwatch-mode" aria-pressed="false">Stopwatch</button>
      </div>
      <div class="timer-inputs" id="timer-inputs">
        <label for="timer-minutes">Min
          <input type="text" id="timer-minutes" value="1" maxlength="5" inputmode="numeric">
        </label>
        <label for="timer-seconds">Sec
          <input type="text" id="timer-seconds" value="0" maxlength="2" inputmode="numeric">
        </label>
      </div>
      <div class="timer-display" id="timer-display" role="timer" aria-live="off">01:00.000</div>
      <div class="timer-status" id="timer-status" aria-live="polite">Ready</div>
      <div class="timer-controls">
        <button type="button" id="timer-start">Start</button>
        <button type="button" id="timer-lap" style="display: none;" disabled>Lap</button>
        <button type="button" id="timer-reset">Reset</button>
      </div>
      <ol class="timer-laps" id="timer-laps" aria-label="Stopwatch laps"></ol>
    </div>
  </div>

  <script>
    (function () {
      var digitIds = ["hour-tens", "hour-ones", "minute-tens", "minute-ones"];
      var clock = document.getElementById("clock");
      var dateDisplay = document.getElementById("date");
      var periodDisplay = document.getElementById("period");
      var format12Button = document.getElementById("format-12");
      var format24Button = document.getElementById("format-24");
      var timerToggle = document.getElementById("timer-toggle");
      var timerBack = document.getElementById("timer-back");
      var timerPanel = document.getElementById("timer-panel");
      var countdownModeButton = document.getElementById("countdown-mode");
      var stopwatchModeButton = document.getElementById("stopwatch-mode");
      var timerInputs = document.getElementById("timer-inputs");
      var timerMinutes = document.getElementById("timer-minutes");
      var timerSeconds = document.getElementById("timer-seconds");
      var timerDisplay = document.getElementById("timer-display");
      var timerStatus = document.getElementById("timer-status");
      var timerStartButton = document.getElementById("timer-start");
      var timerLapButton = document.getElementById("timer-lap");
      var timerResetButton = document.getElementById("timer-reset");
      var timerLaps = document.getElementById("timer-laps");
      var shiftPositions = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      var shiftIndex = 0;
      var previousTime = "";
      var use12Hour = true;
      var timerMode = "countdown";
      var timerRunning = false;
      var timerInterval = null;
      var countdownRemaining = 60000;
      var countdownDeadline = 0;
      var stopwatchElapsed = 0;
      var stopwatchStartedAt = 0;
      var lapTimes = [];
      var lastLapElapsed = 0;

      function padNumber(number) {
        return number < 10 ? "0" + number : String(number);
      }

      function formatDuration(milliseconds) {
        var totalSeconds = Math.floor(milliseconds / 1000);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;
        var millis = milliseconds % 1000;
        var millisText = millis < 10 ? "00" + millis : (millis < 100 ? "0" + millis : String(millis));
        if (hours > 0) {
          return padNumber(hours) + ":" + padNumber(minutes) + ":" + padNumber(seconds) + "." + millisText;
        }
        return padNumber(minutes) + ":" + padNumber(seconds) + "." + millisText;
      }

      function stopTimerInterval() {
        if (timerInterval !== null) {
          window.clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function showTimerValue(milliseconds) {
        timerDisplay.textContent = formatDuration(milliseconds);
      }

      function updateTimer() {
        var now = new Date().getTime();

        if (timerMode === "countdown") {
          countdownRemaining = Math.max(0, countdownDeadline - now);
          showTimerValue(countdownRemaining);
          if (countdownRemaining === 0) {
            timerRunning = false;
            stopTimerInterval();
            timerStartButton.textContent = "Start";
            timerStatus.textContent = "Time is up";
          }
          return;
        }

        showTimerValue(stopwatchElapsed + (timerRunning ? now - stopwatchStartedAt : 0));
      }

      function clearLaps() {
        lapTimes = [];
        lastLapElapsed = 0;
        timerLaps.innerHTML = "";
        timerLapButton.disabled = false;
      }

      function addLap() {
        var elapsed;
        var lapDuration;
        var lapItem;

        if (!timerRunning || timerMode !== "stopwatch" || lapTimes.length >= 10) {
          return;
        }
        elapsed = stopwatchElapsed + new Date().getTime() - stopwatchStartedAt;
        lapDuration = elapsed - lastLapElapsed;
        lastLapElapsed = elapsed;
        lapTimes.push(elapsed);
        lapItem = document.createElement("li");
        lapItem.textContent = "Lap " + lapTimes.length + " — " + formatDuration(lapDuration) + " (total " + formatDuration(elapsed) + ")";
        timerLaps.appendChild(lapItem);
        if (lapTimes.length >= 10) {
          timerLapButton.disabled = true;
          timerStatus.textContent = "10 laps recorded";
        }
      }

      function readCountdownDuration() {
        var minutesText = timerMinutes.value.replace(/^\s+|\s+$/g, "");
        var secondsText = timerSeconds.value.replace(/^\s+|\s+$/g, "");
        var minutes;
        var seconds;

        if (!/^\d+$/.test(minutesText) || !/^\d+$/.test(secondsText)) {
          return null;
        }
        minutes = parseInt(minutesText, 10);
        seconds = parseInt(secondsText, 10);
        if (!isFinite(minutes) || !isFinite(seconds) || seconds > 59) {
          return null;
        }
        return (minutes * 60 + seconds) * 1000;
      }

      function setTimerMode(mode) {
        if (timerRunning) {
          timerRunning = false;
          stopTimerInterval();
        }
        timerMode = mode;
        timerStartButton.textContent = "Start";
        timerStatus.textContent = "Ready";
        timerLapButton.style.display = mode === "stopwatch" ? "block" : "none";
        clearLaps();
        countdownModeButton.setAttribute("aria-pressed", mode === "countdown" ? "true" : "false");
        stopwatchModeButton.setAttribute("aria-pressed", mode === "stopwatch" ? "true" : "false");
        timerInputs.style.display = mode === "countdown" ? "flex" : "none";
        if (mode === "countdown") {
          countdownRemaining = readCountdownDuration();
          if (countdownRemaining === null) {
            countdownRemaining = 0;
          }
          showTimerValue(countdownRemaining);
        } else {
          stopwatchElapsed = 0;
          showTimerValue(0);
        }
      }

      function toggleTimer() {
        if (timerRunning) {
          if (timerMode === "countdown") {
            countdownRemaining = Math.max(0, countdownDeadline - new Date().getTime());
          } else {
            stopwatchElapsed += new Date().getTime() - stopwatchStartedAt;
          }
          timerRunning = false;
          stopTimerInterval();
          timerStartButton.textContent = "Start";
          timerLapButton.disabled = true;
          timerStatus.textContent = "Paused";
          updateTimer();
          return;
        }

        if (timerMode === "countdown") {
          if (countdownRemaining <= 0) {
            countdownRemaining = readCountdownDuration();
          }
          if (countdownRemaining === null || countdownRemaining <= 0) {
            timerStatus.textContent = "Enter a valid time greater than zero";
            return;
          }
          countdownDeadline = new Date().getTime() + countdownRemaining;
          timerStatus.textContent = "Counting down";
        } else {
          stopwatchStartedAt = new Date().getTime();
          timerStatus.textContent = "Stopwatch running";
        }

        timerRunning = true;
        timerStartButton.textContent = "Pause";
        timerLapButton.disabled = timerMode !== "stopwatch";
        stopTimerInterval();
        timerInterval = window.setInterval(updateTimer, 10);
        updateTimer();
      }

      function resetTimer() {
        timerRunning = false;
        stopTimerInterval();
        timerStartButton.textContent = "Start";
        timerStatus.textContent = "Ready";
        clearLaps();
        if (timerMode === "countdown") {
          countdownRemaining = readCountdownDuration();
          if (countdownRemaining === null) {
            timerStatus.textContent = "Enter minutes and seconds";
            countdownRemaining = 0;
          }
          showTimerValue(countdownRemaining);
        } else {
          stopwatchElapsed = 0;
          showTimerValue(0);
        }
        timerLapButton.disabled = true;
      }

      function returnToClock() {
        timerRunning = false;
        stopTimerInterval();
        timerPanel.style.display = "none";
        timerToggle.setAttribute("aria-expanded", "false");
        timerMode = "countdown";
        timerMinutes.value = "1";
        timerSeconds.value = "0";
        countdownRemaining = 60000;
        countdownDeadline = 0;
        stopwatchElapsed = 0;
        stopwatchStartedAt = 0;
        timerStartButton.textContent = "Start";
        timerStatus.textContent = "Ready";
        timerLapButton.style.display = "none";
        timerLapButton.disabled = true;
        countdownModeButton.setAttribute("aria-pressed", "true");
        stopwatchModeButton.setAttribute("aria-pressed", "false");
        timerInputs.style.display = "flex";
        clearLaps();
        showTimerValue(countdownRemaining);
      }

      function updateClock() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var displayHours = hours;
        var time;
        var i;
        var digit;

        if (use12Hour) {
          displayHours = hours % 12 || 12;
        }

        time = (displayHours < 10 ? "0" : "") + displayHours + (minutes < 10 ? "0" : "") + minutes;

        if (time === previousTime) {
          dateDisplay.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
          periodDisplay.textContent = use12Hour ? (hours < 12 ? "AM" : "PM") : "";
          return;
        }

        for (i = 0; i < digitIds.length; i++) {
          digit = document.getElementById(digitIds[i]);
          if (digit.innerHTML !== time.charAt(i)) {
            digit.innerHTML = time.charAt(i);
            digit.className = "digit flip";
            window.setTimeout(function (element) {
              return function () {
                element.className = "digit";
              };
            }(digit), 500);
          }
        }

        previousTime = time;
        dateDisplay.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
        periodDisplay.textContent = use12Hour ? (hours < 12 ? "AM" : "PM") : "";
        clock.setAttribute("aria-label", "Current time, " + (use12Hour ? (displayHours + ":" + (minutes < 10 ? "0" : "") + minutes + " " + periodDisplay.textContent) : time.slice(0, 2) + ":" + time.slice(2)));
      }

      function setTimeFormat(useTwelveHour) {
        use12Hour = useTwelveHour;
        previousTime = "";
        format12Button.setAttribute("aria-pressed", use12Hour ? "true" : "false");
        format24Button.setAttribute("aria-pressed", use12Hour ? "false" : "true");
        updateClock();
      }

      function shiftClock() {
        var position = shiftPositions[shiftIndex];
        clock.style.left = position[0] + "px";
        clock.style.top = position[1] + "px";
        shiftIndex = (shiftIndex + 1) % shiftPositions.length;
      }

      function blankScreenBriefly() {
        clock.style.visibility = "hidden";
        window.setTimeout(function () {
          clock.style.visibility = "visible";
        }, 5000);
      }

      // Read the device's local time immediately, then keep it refreshed.
      format12Button.addEventListener("click", function () { setTimeFormat(true); });
      format24Button.addEventListener("click", function () { setTimeFormat(false); });
      timerToggle.addEventListener("click", function () {
        timerPanel.style.display = "block";
        timerToggle.setAttribute("aria-expanded", "true");
      });
      timerBack.addEventListener("click", function () {
        returnToClock();
      });
      countdownModeButton.addEventListener("click", function () { setTimerMode("countdown"); });
      stopwatchModeButton.addEventListener("click", function () { setTimerMode("stopwatch"); });
      timerStartButton.addEventListener("click", toggleTimer);
      timerLapButton.addEventListener("click", addLap);
      timerResetButton.addEventListener("click", resetTimer);
      timerMinutes.addEventListener("input", resetTimer);
      timerSeconds.addEventListener("input", resetTimer);
      updateClock();
      window.setInterval(updateClock, 1000);
      // Small periodic movement helps avoid keeping the same pixels lit.
      window.setInterval(shiftClock, 30000);
      // Briefly hide the clock for five seconds every five minutes.
      window.setInterval(blankScreenBriefly, 300000);
    }());
  </script>
</body>
</html>
